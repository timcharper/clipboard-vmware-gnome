[package]
name = "clip-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
atspi = { version = "0.29.0", features = ["tokio", "connection"] }
atspi-common = "0.13.0"
zbus = "5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
